name: Runtime v2.3 M23.6 Commercial Finance RC Freeze Gate

on:
  push:
    branches:
      - feat/ai-native-runtime-v2.3-m23.6-finance-rc-freeze
  workflow_dispatch:

jobs:
  g23-6-commercial-finance-rc:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_native_runtime
          MYSQL_USER: ai_native_runtime
          MYSQL_PASSWORD: runtime_ci_password
          MYSQL_ROOT_PASSWORD: runtime_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pruntime_ci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify frozen M23.1 through M23.5 evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=[
            'release/runtime-v2.3-m23.1-billing-operations.json',
            'release/runtime-v2.3-m23.2-collections.json',
            'release/runtime-v2.3-m23.3-revenue-analytics.json',
            'release/runtime-v2.3-m23.4-financial-adjustments.json',
            'release/runtime-v2.3-m23.5-finance-close.json'
          ];
          for(const file of files){
            const x=JSON.parse(fs.readFileSync(file,'utf8'));
            if(x.status!=='STAGING_PASS') throw new Error(`${file}: status=${x.status}`);
            if(x.frozen!==true) throw new Error(`${file}: not frozen`);
            if(x.productionTouched!==false) throw new Error(`${file}: production touched`);
          }
          console.log('M23_1_TO_M23_5_FROZEN_EVIDENCE_PASS');
          NODE

      - name: Apply Runtime migrations twice
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: runtime_ci_password
        run: |
          npm run migrate:runtime
          npm run migrate:runtime

      - name: Validate commercial platform regressions
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: runtime_ci_password
          MYSQL_URL: mysql://ai_native_runtime:runtime_ci_password@127.0.0.1:3306/ai_native_runtime
          PORT: 4400
          RUNTIME_API_BASE_URL: http://127.0.0.1:4400
          RUNTIME_REQUIRE_AUTH: "false"
        run: |
          node src/server.mjs > /tmp/runtime-v23-m236-regression.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4400/ready >/dev/null && break
            sleep 1
          done
          node test/cost-ledger.test.mjs
          npm run validate:commercial-billing
          npm run validate:tenant-quota
          npm run validate:commercial-control
          kill $PID
          trap - EXIT

      - name: Validate authenticated V2.3 commercial finance RC
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: runtime_ci_password
          MYSQL_URL: mysql://ai_native_runtime:runtime_ci_password@127.0.0.1:3306/ai_native_runtime
          PORT: 4500
          RUNTIME_API_BASE_URL: http://127.0.0.1:4500
          RUNTIME_REQUIRE_AUTH: "true"
          RUNTIME_API_TOKEN: m236-platform-token
        run: |
          node src/server.mjs > /tmp/runtime-v23-m236-auth.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4500/ready >/dev/null && break
            sleep 1
          done
          npm run validate:tenant-rbac
          npm run validate:billing-ledger
          npm run validate:billing-operations
          npm run validate:collections
          npm run validate:revenue-analytics
          npm run validate:financial-adjustments
          npm run validate:finance-close
          node test/runtime-v23-commercial-finance-rc-e2e.test.mjs
          node test/railway-compatibility.test.mjs
          kill $PID
          trap - EXIT

      - name: Print Runtime logs on failure
        if: failure()
        run: |
          cat /tmp/runtime-v23-m236-regression.log || true
          cat /tmp/runtime-v23-m236-auth.log || true
