name: Runtime v2.8 M28.12 Master Acceptance QA Compliance Gate

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - feat/ai-native-runtime-v2.8-m28.12-master-acceptance
  workflow_dispatch:

jobs:
  m28-12-master-acceptance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_native_runtime
          MYSQL_USER: ai_native_runtime
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply Runtime migrations twice
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: ci
        run: |
          npm run migrate:runtime
          npm run migrate:runtime

      - name: Validate M27 freeze through M28.12 master acceptance QA compliance
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: ci
          MYSQL_URL: mysql://ai_native_runtime:ci@127.0.0.1:3306/ai_native_runtime
          PORT: 5005
          RUNTIME_API_BASE_URL: http://127.0.0.1:5005
          RUNTIME_REQUIRE_AUTH: "true"
          RUNTIME_API_TOKEN: m2812-platform-token
          RUNTIME_COMMIT_SHA: ${{ github.sha }}
          RUNTIME_ENABLE_INTERNAL_TEST_ADAPTER: "true"
          OPENAI_API_KEY: test
          OPENAI_MODEL: test-model
          OPENAI_BASE_URL: http://127.0.0.1:4010/v1
          OPENAI_TIMEOUT_MS: 10000
          GITHUB_OIDC_AUDIENCE: ai-native-runtime-staging-bridge
          GITHUB_OIDC_EXPECTED_REPOSITORY: zhangxiaomeng880-ui/department-registration-backend
          GITHUB_OIDC_EXPECTED_REF: refs/heads/feat/ai-native-runtime-v2.8-m28.12-master-acceptance
          GITHUB_OIDC_EXPECTED_WORKFLOW_REF: zhangxiaomeng880-ui/department-registration-backend/.github/workflows/runtime-v28-m28-12-master-acceptance.yml@refs/heads/feat/ai-native-runtime-v2.8-m28.12-master-acceptance
        run: |
          node test/mock-openai-responses-server.mjs > /tmp/m2812-mock-openai.log 2>&1 &
          MOCK_PID=$!
          node src/server.mjs > /tmp/runtime-v28-m2812.log 2>&1 &
          RUNTIME_PID=$!
          trap 'kill $RUNTIME_PID $MOCK_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            grep -q 'MOCK_OPENAI_READY' /tmp/m2812-mock-openai.log && break
            sleep 1
          done
          grep -q 'MOCK_OPENAI_READY' /tmp/m2812-mock-openai.log
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5005/ready >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5005/ready >/dev/null
          npm run validate:capability-runtime
          npm run validate:m27-product-development-freeze
          npm run validate:aigc-foundation
          npm run validate:novel-skill-binding
          npm run validate:native-trigger-capability-version
          npm run validate:bridge-executor-reliability
          npm run validate:github-oidc-executor-receipt
          npm run validate:aigc-story-script
          npm run validate:aigc-breakdown
          npm run validate:aigc-format-strategy
          npm run validate:aigc-asset-system
          npm run validate:aigc-generation-image
          npm run validate:aigc-video-audio-production
          npm run validate:aigc-edit-timeline
          npm run validate:aigc-master-acceptance
          node test/railway-compatibility.test.mjs
          kill $RUNTIME_PID $MOCK_PID
          trap - EXIT

      - name: Print Runtime logs on failure
        if: failure()
        run: |
          cat /tmp/runtime-v28-m2812.log || true
          cat /tmp/m2812-mock-openai.log || true
