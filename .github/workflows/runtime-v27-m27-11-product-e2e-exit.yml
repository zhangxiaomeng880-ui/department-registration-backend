name: Runtime v2.7 M27.11 Product E2E Exit Gate

on:
  push:
    branches:
      - feat/ai-native-runtime-v2.7-m27.11-product-e2e-exit
      - work/ai-native-runtime-v2.7-m27.11-product-e2e-exit
  workflow_dispatch:

jobs:
  m27-11-product-e2e-exit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_native_runtime
          MYSQL_USER: ai_native_runtime
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply Runtime migrations twice
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: ci
        run: |
          npm run migrate:runtime
          npm run migrate:runtime

      - name: Validate V2.3 through M27.11 FINAL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: ci
          MYSQL_URL: mysql://ai_native_runtime:ci@127.0.0.1:3306/ai_native_runtime
          PORT: 4998
          RUNTIME_API_BASE_URL: http://127.0.0.1:4998
          RUNTIME_REQUIRE_AUTH: "true"
          RUNTIME_API_TOKEN: m2711-platform-token
          RUNTIME_COMMIT_SHA: ${{ github.sha }}
          RUNTIME_ENABLE_INTERNAL_TEST_ADAPTER: "true"
          OPENAI_API_KEY: test
          OPENAI_MODEL: test-model
          OPENAI_BASE_URL: http://127.0.0.1:4010/v1
          OPENAI_TIMEOUT_MS: 10000
        run: |
          node test/mock-openai-responses-server.mjs > /tmp/m2711-mock-openai.log 2>&1 &
          MOCK_PID=$!
          node src/server.mjs > /tmp/runtime-v27-m2711.log 2>&1 &
          RUNTIME_PID=$!
          trap 'kill $RUNTIME_PID $MOCK_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            grep -q 'MOCK_OPENAI_READY' /tmp/m2711-mock-openai.log && break
            sleep 1
          done
          grep -q 'MOCK_OPENAI_READY' /tmp/m2711-mock-openai.log
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4998/ready >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4998/ready >/dev/null
          npm run validate:billing-ledger
          npm run validate:billing-operations
          npm run validate:collections
          npm run validate:revenue-analytics
          npm run validate:financial-adjustments
          npm run validate:finance-close
          node test/runtime-v23-commercial-finance-rc-e2e.test.mjs
          npm run validate:eval-replay-contract
          npm run validate:eval-runner
          npm run validate:m242-staging-compat
          npm run validate:eval-regression-gate
          npm run validate:m244-staging-compat
          npm run validate:shadow-eval
          npm run validate:eval-reliability
          npm run validate:core-meta-registry
          npm run validate:capability-runtime
          npm run validate:stage-self-loop
          npm run validate:workflow-auto-orchestration
          npm run validate:knowledge-context-backwrite
          npm run validate:domain-workflow-templates
          npm run validate:project-governance
          npm run validate:milestone-intelligence
          npm run validate:competitive-approval
          npm run validate:portfolio-closure
          npm run validate:m26-governance-rc
          npm run validate:product-discovery-baseline
          npm run validate:product-design-technical-contract
          npm run validate:product-ai-contract
          npm run validate:product-engineering-preview
          npm run validate:product-acceptance-qa
          npm run validate:product-release-readiness
          npm run validate:product-release-rollout
          npm run validate:product-post-release-incident
          npm run validate:product-outcome
          npm run validate:product-review
          node --check src/product-domain-e2e-exit.mjs
          npm run validate:product-development-final
          npm run validate:m27-product-development-freeze
          node test/railway-compatibility.test.mjs
          kill $RUNTIME_PID $MOCK_PID
          trap - EXIT

      - name: Print Runtime logs on failure
        if: failure()
        run: |
          cat /tmp/runtime-v27-m2711.log || true
          cat /tmp/m2711-mock-openai.log || true
