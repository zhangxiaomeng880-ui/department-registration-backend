name: Runtime v2.9 M29.4 Analytics Eval Benchmark Gate

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - feat/ai-native-runtime-v2.9-m29.4-analytics-eval-benchmark
  pull_request:
    branches:
      - feat/ai-native-runtime-v2.9-m29.3-automation-intake
  workflow_dispatch:

jobs:
  m29-4-analytics-eval-benchmark:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_native_runtime
          MYSQL_USER: ai_native_runtime
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply Runtime migrations twice
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: ci
        run: |
          npm run migrate:runtime
          npm run migrate:runtime

      - name: Validate M27 freeze through M29.4 analytics and eval
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: ci
          MYSQL_URL: mysql://ai_native_runtime:ci@127.0.0.1:3306/ai_native_runtime
          PORT: 5014
          RUNTIME_API_BASE_URL: http://127.0.0.1:5014
          RUNTIME_REQUIRE_AUTH: "true"
          RUNTIME_API_TOKEN: m294-platform-token
          RUNTIME_COMMIT_SHA: ${{ github.sha }}
          RUNTIME_ENABLE_INTERNAL_TEST_ADAPTER: "true"
          OPENAI_API_KEY: test
          OPENAI_MODEL: test-model
          OPENAI_BASE_URL: http://127.0.0.1:4010/v1
          OPENAI_TIMEOUT_MS: 10000
        run: |
          node test/mock-openai-responses-server.mjs > /tmp/m294-mock-openai.log 2>&1 &
          MOCK_PID=$!
          node src/server.mjs > /tmp/runtime-v29-m294.log 2>&1 &
          RUNTIME_PID=$!
          trap 'kill $RUNTIME_PID $MOCK_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            grep -q 'MOCK_OPENAI_READY' /tmp/m294-mock-openai.log && break
            sleep 1
          done
          grep -q 'MOCK_OPENAI_READY' /tmp/m294-mock-openai.log
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5014/ready >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5014/ready >/dev/null
          npm run validate:eval-replay-contract
          npm run validate:eval-runner
          npm run validate:eval-regression-gate
          npm run validate:eval-reliability
          npm run validate:m27-product-development-freeze
          npm run validate:aigc-domain-final
          npm run validate:m29-data-detection
          npm run validate:m29-decision-self-loop
          npm run validate:m29-automation-intake
          npm run validate:m29-analytics-eval
          node test/railway-compatibility.test.mjs
          kill $RUNTIME_PID $MOCK_PID
          trap - EXIT

      - name: Print Runtime logs on failure
        if: failure()
        run: |
          cat /tmp/runtime-v29-m294.log || true
          cat /tmp/m294-mock-openai.log || true
