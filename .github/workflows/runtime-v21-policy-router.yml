name: Runtime v2.1 Policy Router Gate

on:
  push:
    branches:
      - feat/ai-native-runtime-v2.1-productization
  workflow_dispatch:

jobs:
  g21-multi-provider:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_native_runtime
          MYSQL_USER: ai_native_runtime
          MYSQL_PASSWORD: runtime_ci_password
          MYSQL_ROOT_PASSWORD: runtime_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pruntime_ci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply Runtime migrations twice
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: runtime_ci_password
        run: |
          npm run migrate:runtime
          npm run migrate:runtime

      - name: Validate G21 Multi Provider
        env:
          PORT: 3100
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ai_native_runtime
          DB_USER: ai_native_runtime
          DB_PASSWORD: runtime_ci_password
          RUNTIME_API_BASE_URL: http://127.0.0.1:3100
          OPENAI_API_KEY: x
          OPENAI_MODEL: test-model
          OPENAI_BASE_URL: http://127.0.0.1:4010/v1
        run: |
          node test/mock-openai-responses-server.mjs > /tmp/mock-openai-policy-router.log 2>&1 &
          MOCK_PID=$!
          node src/server.mjs > /tmp/runtime-policy-router.log 2>&1 &
          RUNTIME_PID=$!
          trap 'kill $MOCK_PID $RUNTIME_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health >/dev/null; then
              break
            fi
            sleep 1
          done

          node test/policy-router-v2.test.mjs

      - name: Print logs on failure
        if: failure()
        run: |
          cat /tmp/runtime-policy-router.log || true
          cat /tmp/mock-openai-policy-router.log || true
