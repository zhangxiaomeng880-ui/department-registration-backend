name: Credential Admin Runtime MVP
on:
  push:
    branches: [feat/credential-admin-mvp]
    paths:
      - "src/runtime-rbac.mjs"
      - "src/runtime-api.mjs"
      - "migrations/20261009_staging_credential_rbac_compatibility.sql"
      - "migrations/20261010_credential_role_fk_compatibility.sql"
      - "test/credential-admin-api.test.mjs"
      - "test/staging-credential-rbac-compatibility.test.mjs"
      - "package.json"
      - ".github/workflows/credential-admin-runtime.yml"
  pull_request:
    paths:
      - "src/runtime-rbac.mjs"
      - "src/runtime-api.mjs"
      - "migrations/20261009_staging_credential_rbac_compatibility.sql"
      - "migrations/20261010_credential_role_fk_compatibility.sql"
      - "test/credential-admin-api.test.mjs"
      - "test/staging-credential-rbac-compatibility.test.mjs"
      - "package.json"
      - ".github/workflows/credential-admin-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: node --check src/runtime-rbac.mjs && node --check src/runtime-api.mjs
      - run: node --test test/credential-admin-api.test.mjs

  mysql-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: runtime
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run migrate:runtime
      - run: npm run validate:credential-schema-compat
