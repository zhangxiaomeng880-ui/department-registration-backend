name: Credential Admin Runtime MVP
on:
  push:
    branches: [feat/credential-admin-mvp]
    paths:
      - "src/runtime-rbac.mjs"
      - "src/runtime-api.mjs"
      - "test/credential-admin-api.test.mjs"
      - ".github/workflows/credential-admin-runtime.yml"
  pull_request:
    paths:
      - "src/runtime-rbac.mjs"
      - "src/runtime-api.mjs"
      - "test/credential-admin-api.test.mjs"
      - ".github/workflows/credential-admin-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: node --check src/runtime-rbac.mjs && node --check src/runtime-api.mjs
      - run: node --test test/credential-admin-api.test.mjs
