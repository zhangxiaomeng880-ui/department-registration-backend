name: Requirement Completion Runtime MVP
on:
  push:
    branches: [feat/requirement-completion-runtime-mvp]
    paths:
      - "src/requirement-completion-runtime.mjs"
      - "src/server.mjs"
      - "migrations/20261009_requirement_completion_runtime.sql"
      - "test/requirement-completion-runtime.test.mjs"
      - ".github/workflows/requirement-completion-runtime.yml"
  pull_request:
    paths:
      - "src/requirement-completion-runtime.mjs"
      - "src/server.mjs"
      - "migrations/20261009_requirement_completion_runtime.sql"
      - "test/requirement-completion-runtime.test.mjs"
      - ".github/workflows/requirement-completion-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: node --check src/requirement-completion-runtime.mjs && node --check src/server.mjs
      - run: node --test test/requirement-completion-runtime.test.mjs
